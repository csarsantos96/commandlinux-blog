name: Newsletter
on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.promoted]
permissions:
  contents: read
concurrency:
  group: commandlinux-newsletter
  cancel-in-progress: false
jobs:
  send:
    if: >-
      github.event.client_payload.environment == 'production' &&
      vars.NEWSLETTER_VERCEL_PROJECT_ID != '' &&
      github.event.client_payload.project.id == vars.NEWSLETTER_VERCEL_PROJECT_ID &&
      github.event.client_payload.git.ref == 'main' &&
      (contains(github.event.client_payload.alias, 'commandlinux.dev') ||
       contains(github.event.client_payload.alias, 'www.commandlinux.dev'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Announce deployed articles
        env:
          NEWSLETTER_VERCEL_PROJECT_ID: ${{ vars.NEWSLETTER_VERCEL_PROJECT_ID }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          NEWSLETTER_TEST_EMAIL: ${{ secrets.NEWSLETTER_TEST_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_SEGMENT_PT: ${{ vars.RESEND_SEGMENT_PT }}
          RESEND_SEGMENT_EN: ${{ vars.RESEND_SEGMENT_EN }}
          NEWSLETTER_ENABLED: ${{ vars.NEWSLETTER_ENABLED }}
          NEWSLETTER_MIGRATION_COMPLETE: ${{ vars.NEWSLETTER_MIGRATION_COMPLETE }}
          DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
        run: node scripts/newsletter.mjs publish --after "$DEPLOY_SHA"
