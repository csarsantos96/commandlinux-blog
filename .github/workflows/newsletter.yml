name: Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**/*.md'

permissions:
  contents: read

concurrency:
  group: commandlinux-newsletter
  queue: max

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Hostinger Reach drafts
        env:
          HOSTINGER_REACH_API_TOKEN: ${{ secrets.HOSTINGER_REACH_API_TOKEN }}
          HOSTINGER_REACH_PROFILE_UUID: ${{ secrets.HOSTINGER_REACH_PROFILE_UUID }}
          HOSTINGER_REACH_SENDER_EMAIL: ${{ secrets.HOSTINGER_REACH_SENDER_EMAIL }}
          HOSTINGER_REACH_SENDER_NAME: ${{ secrets.HOSTINGER_REACH_SENDER_NAME }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: >-
          node scripts/newsletter.mjs publish
          --before "$PUSH_BEFORE"
          --after "$PUSH_AFTER"
