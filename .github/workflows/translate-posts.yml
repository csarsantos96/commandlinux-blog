name: Translate posts to English

on:
  # One-time translation run after the Pacific quota reset on September 19, 2026.
  # GitHub cron uses UTC: 07:10 UTC = 00:10 PDT = 02:10 in Acre.
  schedule:
    - cron: '10 7 19 9 *'

  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Maximum posts to translate in this run'
        required: true
        default: '10'
        type: string

  push:
    branches: [main]
    paths:
      - 'src/content/posts/*.md'
      - 'src/content/posts/images/**'
      - 'scripts/translate-posts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/translate-posts.yml'

permissions:
  contents: write

jobs:
  translation-window:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.window.outputs.should_run }}
    steps:
      - name: Allow scheduled translations only on September 19, 2026
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$(date -u +%F)" == "2026-09-19" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  translate:
    needs: translation-window
    if: needs.translation-window.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Translate Portuguese posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MAX_POSTS: ${{ inputs.max_posts || '10' }}
        run: npm run translate:posts

      - name: Validate production build
        run: npm run build

      - name: Commit generated translations
        run: |
          if [[ -z "$(git status --porcelain -- src/content/posts/en)" ]]; then
            echo "No translation changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/content/posts/en
          git commit -m "chore: translate posts to English"
          git push
